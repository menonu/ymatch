<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Moving to the new ymatch URL…</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 32rem;
      margin: 3rem auto;
      padding: 0 1.25rem;
      line-height: 1.5;
    }
    code { font-size: 0.9em; word-break: break-all; }
    .muted { opacity: 0.75; font-size: 0.9rem; }
    a { color: inherit; }
  </style>
</head>
<body>
  <h1>Moving you to the new address</h1>
  <p>
    ymatch now lives at
    <strong><a id="target-link" href="https://{{env "DOMAIN"}}">https://{{env "DOMAIN"}}</a></strong>.
  </p>
  <p id="status" class="muted">Checking for a saved guest session on this old address…</p>
  <p class="muted">
    If nothing happens,
    <a id="manual-link" href="https://{{env "DOMAIN"}}">continue manually</a>.
  </p>
  <script>
    (function () {
      // Caddy templates inject DOMAIN from the container env (same as Caddyfile).
      var TARGET_ORIGIN = "https://{{env "DOMAIN"}}";

      function isUuid(s) {
        return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(s);
      }

      // Flutter SharedPreferences on web stores keys as "flutter.<key>".
      // Values are plain strings (not JSON-quoted) for setString.
      function readGuestUuid() {
        try {
          var raw = localStorage.getItem("flutter.user_uuid");
          if (!raw) return null;
          // Defensive: strip accidental surrounding quotes from older builds.
          if (raw.length >= 2 && raw.charAt(0) === '"' && raw.charAt(raw.length - 1) === '"') {
            raw = raw.slice(1, -1);
          }
          raw = raw.trim();
          return isUuid(raw) ? raw : null;
        } catch (e) {
          return null;
        }
      }

      var statusEl = document.getElementById("status");
      var dest = new URL("/", TARGET_ORIGIN);
      var uuid = readGuestUuid();

      if (uuid) {
        dest.searchParams.set("restore_uuid", uuid);
        if (statusEl) {
          statusEl.textContent = "Found a guest session — restoring on the new site…";
        }
      } else if (statusEl) {
        statusEl.textContent = "No guest session on this browser for the old URL — opening the new site…";
      }

      // Replace so Back does not return to this helper.
      window.location.replace(dest.toString());
    })();
  </script>
</body>
</html>
