name: Deploy to OCI (Staging)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 60

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -H ${{ secrets.OCI_STAGING_VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync repo to VM
        env:
          HOST: ${{ secrets.OCI_STAGING_VM_HOST }}
        run: |
          ssh -i ~/.ssh/oci_key ubuntu@$HOST bash -s <<'SYNC_SCRIPT'
          set -euo pipefail
          REPO_DIR="$HOME/ymatch"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/menonu/ymatch.git"
          # Fetch the same ref that triggered this workflow, not always main.
          # For workflow_dispatch on a branch: that branch. For workflow_run
          # from CI: the head_branch of the completed CI run.
          REF="${{ github.ref_name }}"

          if [ -d "$REPO_DIR/.git" ]; then
            echo "=== Repo already a git working tree, updating remote URL and pulling $REF ==="
            cd "$REPO_DIR"
            # Update the origin URL to use the current GITHUB_TOKEN (rotates
            # per workflow run, so the previous run's token is invalid).
            git remote set-url origin "$REPO_URL"
            git fetch origin "$REF"
            git reset --hard "origin/$REF"
          else
            echo "=== Cloning repo (ref=$REF) via GH_TOKEN ==="
            rm -rf "$REPO_DIR"
            git clone "$REPO_URL" "$REPO_DIR"
            cd "$REPO_DIR"
            git checkout "$REF"
          fi
          SYNC_SCRIPT

      - name: Deploy to Staging
        env:
          HOST: ${{ secrets.OCI_STAGING_VM_HOST }}
          # Non-secret FQDN from repo Variables (Settings → Secrets and variables → Actions → Variables).
          DOMAIN: ${{ vars.OCI_DOMAIN_STAGING }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          DB_PASSWORD: ${{ secrets.OCI_STAGING_DB_PASSWORD }}
          # Web Push + VAPID (#179 / ADR 0015). Map staging-suffixed secrets →
          # unsuffixed process env names used by docker-compose.oci.yml.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY_STAGING }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY_STAGING }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT_STAGING }}
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "❌ Repository variable OCI_DOMAIN_STAGING is not set (public app FQDN)."
            exit 1
          fi
          if [ -z "$DUCKDNS_TOKEN" ]; then
            echo "❌ Secret DUCKDNS_TOKEN is not set."
            exit 1
          fi
          if [ -n "${VAPID_PRIVATE_KEY:-}" ] && [ -n "${VAPID_PUBLIC_KEY:-}" ]; then
            echo "Web Push: VAPID secrets present for staging"
          else
            echo "⚠️ Web Push: VAPID_*_STAGING secrets missing or empty; push will be no-op"
          fi
          # Shell-safe remote env (printf %q) so secrets with special chars do not break.
          # VAPID_* may be empty (optional); still pass so host .env is refreshed.
          REMOTE_ENV="$(printf 'DOMAIN=%q DUCKDNS_TOKEN=%q DB_PASSWORD=%q VAPID_PUBLIC_KEY=%q VAPID_PRIVATE_KEY=%q VAPID_SUBJECT=%q' \
            "$DOMAIN" "$DUCKDNS_TOKEN" "$DB_PASSWORD" \
            "${VAPID_PUBLIC_KEY:-}" "${VAPID_PRIVATE_KEY:-}" "${VAPID_SUBJECT:-}")"
          # shellcheck disable=SC2029
          ssh -i ~/.ssh/oci_key "ubuntu@${HOST}" "env ${REMOTE_ENV} bash -s" <<'DEPLOY_SCRIPT'
          set -euo pipefail
          cd ~/ymatch

          # DOMAIN / DUCKDNS_TOKEN / DB_PASSWORD / VAPID_* injected via ssh env.
          ./scripts/oci_deploy_staging.sh

          echo "=== Running staging migrations ==="
          docker exec ymatch_backend ymatch_backend migrate 2>/dev/null || true
          DEPLOY_SCRIPT

      - name: Health check (Staging)
        env:
          # Primary hostname from repo variable OCI_DOMAIN_STAGING (issue #523).
          DOMAIN: ${{ vars.OCI_DOMAIN_STAGING }}
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "❌ Repository variable OCI_DOMAIN_STAGING is not set."
            exit 1
          fi
          APP_URL="https://${DOMAIN}"
          for i in $(seq 1 12); do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "${APP_URL}/api/v1/system/status" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging backend healthy (attempt $i)"
              break
            fi
            echo "⏳ Waiting for staging backend... (attempt $i, status: $STATUS)"
            sleep 5
          done

          FRONTEND=$(curl -sk -o /dev/null -w "%{http_code}" "${APP_URL}/" || true)
          if [ "$FRONTEND" = "200" ]; then
            echo "✅ Staging frontend healthy"
          else
            echo "⚠️ Staging frontend returned $FRONTEND"
          fi

          # Optional: Web Push public key when VAPID is configured (#179).
          VAPID_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "${APP_URL}/api/v1/push/vapid-public-key" || true)
          if [ "$VAPID_STATUS" = "200" ]; then
            echo "✅ Staging VAPID public key endpoint OK"
          elif [ "$VAPID_STATUS" = "404" ]; then
            echo "ℹ️ Staging VAPID public key not configured (404; push no-op)"
          else
            echo "⚠️ Staging VAPID public key endpoint returned $VAPID_STATUS"
          fi

      - name: Report to New Relic
        if: always()
        run: |
          curl -s -X POST "https://insights-collector.newrelic.com/v1/accounts/${{ secrets.NEW_RELIC_ACCOUNT_ID }}/events" \
            -H "Api-Key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "[{
              \"eventType\": \"Deployment\",
              \"status\": \"${{ job.status }}\",
              \"trigger\": \"${{ github.event_name }}\",
              \"commitSha\": \"${{ github.event.workflow_run.head_sha || github.sha }}\",
              \"branch\": \"main\",
              \"target\": \"oci-staging\"
            }]" || true

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/oci_key
