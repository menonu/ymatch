# OCI Always Free Tier — Full Stack Deployment
# Run on ARM Ampere A1 instance with Docker Compose.
#
# This single compose file is used by BOTH production and staging, each on its
# own VM (see issue #209). The two environments are byte-identical stacks that
# differ only by VM host, DB password, and DuckDNS subdomain (issue #523):
#   - Production: deployed via .github/workflows/deploy-oci.yml (OCI_VM_HOST)
#   - Staging:    deployed via .github/workflows/deploy-oci-staging.yml (OCI_STAGING_VM_HOST)
#
# Caddy serves on 80/443 with auto-SSL:
#   - Primary:  https://{$DOMAIN}  (FQDN from env / GitHub var OCI_DOMAIN(_STAGING))
#   - Legacy:   https://{$PUBLIC_IP}.nip.io → 301 redirect to {$DOMAIN}
#
# Usage:
#   DOMAIN=$OCI_DOMAIN PUBLIC_IP=x.x.x.x DB_PASSWORD=xxx GIT_HASH=abc \
#     docker compose -f docker-compose.oci.yml --profile ddns up -d --build
#
# DuckDNS keep-alive (profile "ddns") requires DUCKDNS_TOKEN + DUCKDNS_SUBDOMAIN.

services:
  # --- PostgreSQL ---
  db:
    image: ghcr.io/menonu/ymatch/postgres:16-alpine
    container_name: ymatch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ymatch_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD env var}
      POSTGRES_DB: ymatch
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ymatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ymatch_user -d ymatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend ---
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile.prod
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
    container_name: ymatch_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://ymatch_user:${DB_PASSWORD}@db:5432/ymatch"
      RUST_LOG: info
      PORT: "3000"
      IMAGE_STORAGE: local
      # Web Push + VAPID (ADR 0015 / #179). Optional — empty = safe no-op.
      # Staging: VAPID_*_STAGING secrets → these names; production: VAPID_* secrets.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - uploads:/app/uploads
    networks:
      - ymatch
    depends_on:
      db:
        condition: service_healthy

  # --- Frontend ---
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile.prod
      args:
        API_BASE_URL: ""
        GIT_HASH: ${GIT_HASH:-unknown}
        X_PROFILE_URL: ${X_PROFILE_URL:-}
        DISCORD_INVITE_URL: ${DISCORD_INVITE_URL:-}
    container_name: ymatch_frontend
    restart: unless-stopped
    networks:
      - ymatch

  # --- Caddy (ports 80/443, auto-SSL; DuckDNS primary + nip.io redirect) ---
  caddy:
    image: ghcr.io/menonu/ymatch/caddy:2-alpine
    container_name: ymatch_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.oci:/etc/caddy/Caddyfile:ro
      # One-shot nip.io → DuckDNS session migration page (#527).
      - ./caddy/migrate-session.html:/srv/migrate/index.html:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Quote required: YAML treats bare ":" as mapping syntax.
      DOMAIN: "${DOMAIN:?Set DOMAIN env var from OCI_DOMAIN}"
      PUBLIC_IP: "${PUBLIC_IP:?Set PUBLIC_IP env var}"
    networks:
      - ymatch
    depends_on:
      - backend
      - frontend

  # --- DuckDNS keep-alive (optional; enable with --profile ddns) ---
  # Refreshes the A record if the public IP drifts without a terraform apply.
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: ymatch_duckdns
    restart: unless-stopped
    profiles: ["ddns"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      # Not :?-required: compose interpolates all services even when profile is off.
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
      UPDATE_IP: ipv4
    # No ports / no app network needed — only outbound HTTPS to duckdns.org.

networks:
  ymatch:
    driver: bridge

volumes:
  pg_data:
  uploads:
  caddy_data:
  caddy_config:
